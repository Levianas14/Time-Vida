name: tempo_vivo
description: Gerenciador pessoal de tempo, rotina e foco.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.0
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/InterVariable.ttf
          weight: 500
        - asset: assets/fonts/InterVariable.ttf
          weight: 600
        - asset: assets/fonts/InterVariable.ttf
          weight: 700
